# For Dokploy's "Docker Compose" service type (or `docker compose up` on any
# server). Set the domain iqoo.yadvin.tech → port 4000 in Dokploy's Domains
# tab; Dokploy's Traefik adds HTTPS. Variables come from Dokploy's
# Environment tab (see dokploy.env.example).
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB: ${MONGODB_DB:-gurtu}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${FIREBASE_SERVICE_ACCOUNT_BASE64}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-gurtu-f6687}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Kolkata}
    expose:
      - "4000"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
